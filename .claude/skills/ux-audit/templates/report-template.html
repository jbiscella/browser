<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Design system for ux-audit reports. Light palette on :root, dark palette twice (system + explicit toggle). */
:root{
  --paper:#F8F6F1; --surface:#FFFFFF; --ink:#26262B; --mute:#68676E; --line:#E4E0D6; --line-strong:#CBC6B8;
  --accent:#E8931C; --accent-ink:#8A5208; --accent-soft:#FBEBD2;
  --crit:#B3261E; --crit-soft:#F8E3E1; --imp:#B8690A; --imp-soft:#F9EBD6; --good:#2F7A4E; --good-soft:#E1F0E6;
  --shadow:0 1px 2px rgba(38,38,43,.06),0 8px 24px -12px rgba(38,38,43,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#18181B; --surface:#212125; --ink:#ECEAE4; --mute:#A4A39D; --line:#34343A; --line-strong:#4B4B53;
    --accent:#F2A83A; --accent-ink:#F0BC66; --accent-soft:#3D2E14;
    --crit:#E4756C; --crit-soft:#3B1F1D; --imp:#E4A24A; --imp-soft:#3A2A16; --good:#6FBF8B; --good-soft:#1C3324;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --paper:#18181B; --surface:#212125; --ink:#ECEAE4; --mute:#A4A39D; --line:#34343A; --line-strong:#4B4B53;
  --accent:#F2A83A; --accent-ink:#F0BC66; --accent-soft:#3D2E14;
  --crit:#E4756C; --crit-soft:#3B1F1D; --imp:#E4A24A; --imp-soft:#3A2A16; --good:#6FBF8B; --good-soft:#1C3324;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:18px;line-height:1.6;padding-inline:20px;padding-block:0 96px;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto}
.wide{width:min(960px,100vw - 40px);position:relative;left:50%;transform:translateX(-50%)}
h1,h2,h3{font-family:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;text-wrap:balance;line-height:1.08;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(40px,6.5vw,66px);font-weight:700}
h2{font-size:clamp(28px,4.2vw,38px);font-weight:700;margin-top:88px;padding-top:24px;border-top:3px solid var(--ink)}
h3{font-size:23px;font-weight:600;margin-top:40px}
p{margin:16px 0}
a{color:var(--accent-ink);text-decoration-color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.eyebrow{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
header{padding-block:64px 24px;border-bottom:1px solid var(--line)}
header .eyebrow{color:var(--accent-ink)}
header .lede{font-size:21px;line-height:1.45;max-width:640px;margin-top:20px}
.meta{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:28px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px;color:var(--mute)}
.meta b{color:var(--ink);font-weight:500}
.verdict{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-top:40px}
.verdict>div{background:var(--surface);padding:18px 20px}
.verdict .n{font-family:"Bricolage Grotesque",sans-serif;font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.verdict .l{font-size:14.5px;color:var(--mute);margin-top:6px;line-height:1.35}
.n.crit{color:var(--crit)}.n.imp{color:var(--imp)}.n.good{color:var(--good)}
@media (max-width:560px){.verdict{grid-template-columns:1fr}}
.chip{display:inline-block;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:3px;vertical-align:middle;font-weight:500}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.imp{background:var(--imp-soft);color:var(--imp)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.min{background:var(--accent-soft);color:var(--accent-ink)}
.finding{margin-top:36px;padding-top:24px;border-top:1px solid var(--line)}
.finding:first-of-type{border-top:0;padding-top:0}
.finding h3{margin-top:0;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.finding .fix{margin-top:14px;padding:12px 16px;background:var(--surface);border-left:3px solid var(--accent);font-size:16px}
.finding .fix b{font-weight:600}
table{width:100%;border-collapse:collapse;font-size:15.5px;margin:20px 0}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:500;border-bottom:1px solid var(--line-strong)}
td.num,th.num{text-align:right;font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
td code{white-space:nowrap}
.tbl{overflow-x:auto}
figure{margin:28px 0}
figure img{display:block;max-width:100%;height:auto;border:1px solid var(--line-strong);box-shadow:var(--shadow);background:#fff}
figcaption{font-size:14.5px;color:var(--mute);margin-top:10px;line-height:1.5}
figcaption b{color:var(--ink);font-weight:600}
.duo{display:grid;grid-template-columns:1fr;gap:24px;align-items:start}
@media (min-width:820px){.duo{grid-template-columns:300px 1fr;gap:32px}}
.duo figure{margin:0}
.duo table{font-size:14.5px}
.duo td:first-child{white-space:nowrap}
.phone img{max-width:300px;margin:0 auto}
.trio{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;align-items:start}
.trio figure{margin:0}
.callout{background:var(--surface);border:1px solid var(--line);padding:20px 24px;margin:24px 0}
.callout .eyebrow{margin-bottom:6px}
code{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.88em;background:var(--accent-soft);color:var(--accent-ink);padding:1px 5px;border-radius:3px}
pre{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:14px;background:var(--surface);border:1px solid var(--line);padding:14px 16px;overflow-x:auto;margin:16px 0}
ul,ol{padding-left:22px}li{margin:8px 0}
ol.prio{counter-reset:p;list-style:none;padding:0;margin-top:24px}
ol.prio li{counter-increment:p;display:grid;grid-template-columns:56px 1fr;gap:16px;padding:18px 0;border-top:1px solid var(--line);margin:0}
ol.prio li::before{content:counter(p,decimal-leading-zero);font-family:"Bricolage Grotesque",sans-serif;font-size:40px;font-weight:700;line-height:1;color:var(--accent)}
ol.prio li b{display:block;font-weight:600;font-size:19px;margin-bottom:4px}
ol.prio li .eff{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;color:var(--mute);margin-top:6px;letter-spacing:.04em}
.plus li::marker{color:var(--good)}
.urls{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px;word-break:break-all;line-height:1.7}
.urls li{margin:4px 0}
footer{margin-top:80px;padding-top:20px;border-top:1px solid var(--line);font-size:14px;color:var(--mute)}
@media print{body{padding:0;font-size:12pt}.wide{width:100%;left:0;transform:none}figure img{box-shadow:none}h2{break-before:page}h2:first-of-type{break-before:auto}}
</style>
</head>
<body>
{{BODY}}
</body>
</html>
